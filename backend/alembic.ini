[alembic]
script_location = alembic
# The runtime URL is injected programmatically by backend.database.run_migrations
# so it always targets the active MINDGUARD_DB_DIR. The value below is only a
# CLI fallback (e.g. `alembic current` from the backend/ directory).
sqlalchemy.url = sqlite:///mindguard.db
file_template = %%(rev)s_%%(slug)s

# Alembic logging is intentionally not configured here: the application owns
# logging configuration (backend/logging_setup.py). Keeping this file free of
# a [loggers] section stops Alembic from clobbering the app/test config.
